[project]
name = "simple-yamba-music-pipeline"
version = "0.1.0"
description = "Minimal local HOMR evaluation: score images/PDFs -> MusicXML -> MuseScore review"
requires-python = ">=3.11,<3.13"
dependencies = ["homr[cpu]==0.7.0"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
